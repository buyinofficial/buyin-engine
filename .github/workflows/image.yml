# Test, then build the engine image and push it to GHCR.
# The build is reproducible: file times are the commit time (SOURCE_DATE_EPOCH + rewrite-timestamp) and the image
# carries no build-time labels, so the same commit always gives the same digest — anyone can rebuild and compare.
# The digest printed in the job summary is the value docker-compose.yml pins and the TEE attestation measures.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # tag builds publish a GitHub Release (digest, commit, run)
  packages: write
  id-token: write      # signed build provenance (Sigstore, GitHub OIDC)
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # No labels/annotations (they would carry the build time). provenance/sbom off for the same reason.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
          sbom: false
          build-args: GIT_COMMIT=${{ github.sha }}

      # Signed statement by GitHub: this digest was built from this commit by this workflow. Pushed next to the image as an
      # OCI referrer — it does not change the image or its digest. Check: gh attestation verify oci://<image@digest> --repo <repo>
      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: \`$IMAGE\`"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Build run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Signed build provenance: \`gh attestation verify oci://$IMAGE --repo $GITHUB_REPOSITORY\`"
            echo ""
            echo "The image is reproducible: rebuilding this commit gives the same digest (README → Rebuild the image yourself)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_STEP_SUMMARY"
