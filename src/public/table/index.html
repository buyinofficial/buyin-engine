<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUY-IN</title>
<link rel="stylesheet" href="table.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<main id="table" class="pc" data-testid="tee-table">
  <div class="bg"><img class="bg-img" alt=""><div class="bg-shade"></div></div>
  <div id="stage">
  <div id="board-area">
    <div class="pot-wrap">
      <div class="pot-chips" aria-hidden="true"></div>
      <div class="pot-panel" data-testid="pot">
        <span class="pot-title" data-i18n="pot"></span>
        <span class="pot-total">0</span>
        <div class="pot-grid">
          <div><div class="pk main" data-i18n="potMain"></div><div class="pv main-v">0</div></div>
          <div class="side"><div class="pk">SIDE 1</div><div class="pv">—</div></div>
          <div class="side"><div class="pk">SIDE 2</div><div class="pv">—</div></div>
        </div>
        <div class="pot-uncalled"><span class="pk" data-i18n="uncalled"></span><span class="pv">—</span></div>
        <i class="pot-glow"></i>
      </div>
    </div>
    <div class="board" data-testid="board"></div>
  </div>
  <div id="seats"></div>
  <div id="bets"></div>
  <div class="turnbar" hidden><i></i></div>
  </div>

  <div class="corner tl">
    <button type="button" class="round" id="btn-leave" data-i18n-title="leave"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    <div id="game-clock" hidden data-testid="game-clock">
      <svg class="gc-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="gc-track" cx="20" cy="20" r="17"/><circle class="gc-arc" cx="20" cy="20" r="17" pathLength="100"/></svg>
      <svg class="gc-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
      <div class="gc-txt"><small class="gc-k"></small><b class="gc-v"></b></div>
      <div class="gc-pips" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="corner tr">
    <button type="button" class="round" id="btn-sound" data-i18n-title="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    <button type="button" class="round" id="btn-settings" data-i18n-title="settings" data-testid="btn-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button type="button" class="round" id="btn-verify" data-i18n-title="verify"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></button>
  </div>

  <div id="actions" hidden>
    <div class="act-top">
      <div class="presets"></div>
      <div class="gauge">
        <div class="gauge-bubble" hidden><b>0</b><span class="cur"></span></div>
        <div class="gauge-well"><span class="gauge-fill"></span></div>
        <input type="range" class="gauge-input" min="0" max="1000" step="1" value="0" aria-label="raise amount">
        <div class="gauge-handle"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="act-main">
      <button type="button" class="a-fold" data-act="FOLD"><span class="t" data-i18n="fold"></span></button>
      <button type="button" class="a-call" data-act="CALL"><span class="t"></span><span class="s"></span></button>
      <button type="button" class="a-raise" data-act="RAISE"><span class="t"></span><span class="s"></span></button>
    </div>
  </div>

  <div class="verify-badge" data-testid="tee-badge"><button type="button"><span class="lock" aria-hidden="true">🔒</span><span data-i18n="cardCheck"></span><b class="vb-state"></b></button></div>
  <button type="button" class="room-label" data-testid="room-hand"></button>
  <div id="rebuy-bar" hidden data-testid="rebuy-bar"><span class="rb-msg"></span><button type="button" class="rb-go" data-testid="rebuy-go"></button></div>
  <div id="emote-pick" hidden data-testid="emote-pick"></div>
  <div id="tip-pick" hidden data-testid="tip-pick"></div>
  <div id="tip-target" hidden data-testid="tip-target"><span class="tt-msg"></span><button type="button" class="tt-x" aria-label="cancel">×</button></div>
  <div id="chat-dock" data-testid="chat-dock">
    <button type="button" id="btn-dark" class="dark-toggle" data-testid="btn-dark"><i class="dk-ico" aria-hidden="true"></i><span><b data-i18n="darkTitle"></b><small class="dk-sub"></small></span></button>
    <div id="chat" class="closed" data-testid="chat">
      <button type="button" class="chat-head"><span data-i18n="chatTitle"></span><i class="dot" hidden></i><b class="chev">▲</b></button>
      <div class="chat-lines"></div>
      <div class="chat-form"><input type="text" class="chat-input" maxlength="200" autocomplete="off" data-i18n-ph="chatPh"><button type="button" class="chat-send" data-i18n="send"></button></div>
    </div>
  </div>
  <button type="button" id="btn-chat-m" class="chat-m" data-testid="btn-chat-m" aria-label="chat">💬<i class="dot" hidden></i></button>
  <div id="chat-m" hidden data-testid="chat-m">
    <div class="chat-lines"></div>
    <div class="chat-form"><input type="text" class="chat-input" maxlength="200" autocomplete="off" data-i18n-ph="chatPh"><button type="button" class="chat-send" data-i18n="send"></button><button type="button" class="chat-x" aria-label="close">×</button></div>
  </div>
  <div id="banner" hidden aria-hidden="true"><div class="bn-band"><b class="bn-title"></b><small>TEXAS HOLD'EM</small><i class="bn-shine"></i></div></div>
  <div id="dark-reveal" hidden data-testid="dark-reveal"><small data-i18n="darkMyHand"></small><div class="dr-cards"></div></div>
  <div id="settings" hidden data-testid="settings">
    <div class="st-box">
      <div class="st-head"><b data-i18n="settings"></b><button type="button" class="st-x" aria-label="close">×</button></div>
      <label class="st-row"><span data-i18n="volume"></span><input type="range" id="st-vol" min="0" max="1" step="0.1"><b class="st-vv"></b></label>
      <div class="st-pre"><button type="button" data-v="0">0</button><button type="button" data-v="0.25">25</button><button type="button" data-v="0.5">50</button><button type="button" data-v="0.75">75</button><button type="button" data-v="1">100</button></div>
    </div>
  </div>
  <div id="ready-q" hidden data-testid="ready-q">
    <div class="rq-box">
      <i class="rq-glow" aria-hidden="true"></i>
      <div class="rq-head"><small>BUY-IN · TEXAS HOLD'EM</small><b class="rq-title" data-i18n="rqTitle"></b><p class="rq-sub"></p></div>
      <div class="rq-info"><span class="rq-time"></span><span class="rq-final"></span></div>
      <ul class="rq-list"></ul>
      <div class="rq-foot">
        <div class="rq-count"></div>
        <button type="button" class="rq-btn" data-testid="ready-btn"></button>
        <div class="rq-note"></div>
      </div>
    </div>
  </div>
  <div id="notice" hidden aria-live="polite"><b class="nt-k"></b><span class="nt-v"></span></div>
  <div id="toast" hidden></div>
  <div id="gate" hidden><div class="gate-box"><p class="gate-msg"></p><button type="button" class="gate-back" hidden data-i18n="toLobby"></button></div></div>
</main>
<div id="fx" aria-hidden="true"></div>
</body>
</html>
