        <div class="rq-chat" data-testid="rq-chat"><div class="rq-lines"></div><form class="chat-form rq-form" novalidate><input type="text" class="chat-input" data-testid="rq-chat-input" maxlength="200" autocomplete="off" enterkeyhint="send" data-i18n-ph="chatPh"><button type="submit" class="chat-send" data-testid="rq-chat-send"><svg class="snd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 11.1 20.2 3.9c.5-.2 1 .3.8.8l-7.2 16.6c-.2.5-.9.5-1.1 0l-2.4-6.7-6.7-2.4c-.5-.2-.5-.9 0-1.1z"/><path d="M10.3 13.7 20.6 4.3"/></svg></button></form></div>
      </div>
    </div>
  </div>
  <div id="notice" hidden aria-live="polite"><b class="nt-k"></b><span class="nt-v"></span></div>
  <div id="toast" hidden></div>
  <div id="gate" hidden><div class="gate-box"><p class="gate-msg"></p><button type="button" class="gate-back" hidden data-i18n="toLobby"></button></div></div>
</main>
<div id="fx" aria-hidden="true"></div>
<!-- [NET_LEAVE_0_10_9] 연결 상태 · 나가기 확인 (원본 게임과 같은 흐름) -->
<div id="net-pill" hidden data-testid="net-pill"><i></i><span data-i18n="netRetry"></span></div>
<div id="net-over" hidden data-testid="net-over"><div class="net-box"><i class="net-spin"></i><b data-i18n="netLost"></b><p data-i18n="netLostSub"></p><button type="button" class="net-reload" hidden data-i18n="netReload"></button></div></div>
<div id="show-pick" hidden data-testid="show-pick"><small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg><span data-i18n="showTitle"></span></small><div><button type="button" data-w="left" data-i18n="showLeft"></button><button type="button" data-w="both" data-i18n="showBoth"></button><button type="button" data-w="right" data-i18n="showRight"></button></div></div>
<div id="pf-pop" hidden data-testid="pf-pop"></div>
<div id="rotate" hidden data-testid="rotate"><div class="rt-box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><b data-i18n="rotate"></b></div></div>
<div id="leave-ask" hidden data-testid="leave-ask"><div class="la-box"><b data-i18n="leaveAsk"></b><p class="la-sub"></p><div class="la-btns"><button type="button" class="la-no" data-i18n="cancel"></button><button type="button" class="la-yes" data-i18n="leave"></button></div></div></div>
</body>
</html>
