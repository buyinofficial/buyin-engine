# Phala Cloud (dstack, Intel TDX) deployment of the BUY-IN engine.
# The image is pinned by digest: it is the v0.5.9 image built by GitHub Actions from this repository.
# The build is reproducible — rebuilding tag v0.5.9 gives the same digest (README → "Rebuild the image yourself").
# This file's hash is measured into the TEE (compose-hash in RTMR3), so anyone can recompute it and compare.
# TEE_RPC_TOKEN is an encrypted secret: only the TEE can decrypt it. It decides who may call /rpc, nothing else.
# TEE_CONSOLE_KEY is public: the console's key for seat tickets. Only tickets it signed can seat a player; it cannot see or move cards.
# Hand records are kept on the TEE data disk (volume "records"), encrypted with a key only the TEE receives.
services:
  engine:
    image: ghcr.io/buyinofficial/buyin-engine@sha256:57fa97ddeff063ae72758f9232fddccd4a03050f8c6c26a002c66b5859bb097b
    restart: always
    # Hardening: no Linux capabilities, no privilege escalation, read-only root filesystem
    # (the engine writes only to /data), small /tmp, memory and process limits.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 1536m
    pids_limit: 256
    ports:
      - "3900:3900"
    environment:
      - TEE_MODE=dstack
      - TEE_RECORD_DIR=/data/records
      - TEE_RPC_TOKEN=${TEE_RPC_TOKEN}
      - TEE_DISCONNECT_GRACE_MS=60000
      - TEE_RETENTION_DAYS=7
      - TEE_CONSOLE_URL=https://h.pokerzero.site/tee-records
      - 'TEE_CONSOLE_KEY={"kty":"EC","crv":"P-256","x":"Z-pNFOk3vPf5FJ9oYxAM6CFXzdwnBa-BwzK61tITj6U","y":"paD-KrbLEEq0IbvCCwBwk4_twokYa8iR811C0zCYuRk"}'
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - records:/data

volumes:
  records:
