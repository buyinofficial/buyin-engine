# Phala Cloud (dstack, Intel TDX) deployment of the BUY-IN engine.
# The image is pinned by digest: it is the v0.3.0 image built by GitHub Actions from this repository.
# This file's hash is measured into the TEE (compose-hash in RTMR3), so anyone can recompute it and compare.
# TEE_RPC_TOKEN is an encrypted secret: only the TEE can decrypt it. It decides who may call /rpc, nothing else.
services:
  engine:
    image: ghcr.io/buyinofficial/buyin-engine@sha256:14cf36f48ca1ea69299d11d035f2846b1371935146304839dfcaa3c8c6cba1fc
    restart: always
    ports:
      - "3900:3900"
    environment:
      - TEE_MODE=dstack
      - TEE_RPC_TOKEN=${TEE_RPC_TOKEN}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
