# Phala Cloud (dstack, Intel TDX) deployment of the BUY-IN engine.
# The image is pinned by digest: the image GitHub Actions built from this repository (see the GitHub Release of the version).
# The build is reproducible — rebuilding the tag gives the same digest (README → "Rebuild the image yourself").
# This file's hash is measured into the TEE (compose-hash in RTMR3), so anyone can recompute it and compare.
# TEE_RPC_TOKEN is the one encrypted secret: only the TEE can decrypt it. The engine sends its records to the console with it,
# and the console uses it for the check API. It cannot open any route into a hand in play — there is none.
# TEE_CONSOLE_KEY is public: the console's key for seat tickets. Only tickets it signed can seat a player; it cannot see or move cards.
# Hand records are kept on the TEE data disk (volume "records", SQLite), encrypted with a key only the TEE receives, for TEE_RETENTION_DAYS.
# Container logs are capped (7 files of 5 MB) so nothing piles up; the engine logs only start-up and clean-up lines, never cards.
services:
  engine:
    image: ghcr.io/buyinofficial/buyin-engine@sha256:e7380ef69f740dcdce5160c8a564f5c237256d169ec3f9a7e5e0c7287b4221bf
    restart: always
    # Hardening: no Linux capabilities, no privilege escalation, read-only root filesystem
    # (the engine writes only to /data), small /tmp, memory and process limits.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "7"
    ports:
      - "3900:3900"
    environment:
      - TEE_MODE=dstack
      - TEE_RECORD_DIR=/data/records
      - TEE_RPC_TOKEN=${TEE_RPC_TOKEN}
      - TEE_DISCONNECT_GRACE_MS=60000
      - TEE_RETENTION_DAYS=7
      - TEE_CONSOLE_URL=https://h.pokerzero.site/tee-records
      - 'TEE_CONSOLE_KEY={"kty":"EC","crv":"P-256","x":"Z-pNFOk3vPf5FJ9oYxAM6CFXzdwnBa-BwzK61tITj6U","y":"paD-KrbLEEq0IbvCCwBwk4_twokYa8iR811C0zCYuRk"}'
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - records:/data

volumes:
  records:
